<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captain View — корабль от первого лица</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #06111b; color: #e7f6ff; font-family: Inter, Arial, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.65); font-size: 15px; }
    #panel { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(2, 12, 22, 0.6); pointer-events: auto; text-align: center; }
    .card { width: min(560px, 92vw); border-radius: 16px; border: 1px solid rgba(140,220,255,.35); background: rgba(8, 28, 42, 0.9); padding: 22px 16px; box-shadow: 0 16px 36px rgba(0,0,0,.45); }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { margin: 6px 0; color: #ccecff; }
    .btn { margin-top: 12px; border: 0; border-radius: 999px; padding: 12px 22px; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; background: linear-gradient(135deg,#16b5ff,#0a72cf); }
    #mobile { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: none; gap: 12px; pointer-events: auto; }
    .mBtn { width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.18); color: #fff; font-size: 22px; font-weight: 800; }
    @media (max-width: 920px) { #mobile { display: flex; } }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud">
    <div>Дистанция: <span id="score">0</span> м</div>
    <div>Лучший рейс: <span id="best">0</span> м</div>
    <div>Прочность: <span id="hp">3</span></div>
  </div>
  <div id="panel"><div class="card" id="panelCard"><h1>🚢 Captain View</h1><p>Настоящий корабль от первого лица.</p><p>Рули влево/вправо и обходи мины и рифы.</p><p>Управление: <b>A/D</b> или <b>←/→</b>.</p><button class="btn" id="startBtn">Выйти в море</button></div></div>
  <div id="mobile"><button class="mBtn" id="leftBtn">◀</button><button class="mBtn" id="rightBtn">▶</button></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), hpEl = document.getElementById('hp');
  const panel = document.getElementById('panel'), panelCard = document.getElementById('panelCard');
  const startBtn = document.getElementById('startBtn'), leftBtn = document.getElementById('leftBtn'), rightBtn = document.getElementById('rightBtn');

  let W = 0, H = 0;
  const resize = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
  resize(); addEventListener('resize', resize);

  const bestKey = 'captainViewBest';
  let best = Number(localStorage.getItem(bestKey) || 0);

  const keys = { left: false, right: false };
  addEventListener('keydown', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true; if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true; });
  addEventListener('keyup', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false; if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false; });
  for (const [btn, side] of [[leftBtn, 'left'], [rightBtn, 'right']]) {
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[side] = true; }, { passive: false });
    btn.addEventListener('touchend', () => keys[side] = false);
    btn.addEventListener('touchcancel', () => keys[side] = false);
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[side] = true; });
    btn.addEventListener('mouseup', () => keys[side] = false);
    btn.addEventListener('mouseleave', () => keys[side] = false);
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const game = { running: false, time: 0, distance: 0, hp: 3, speed: 0.014, shipX: 0, shipVx: 0, seaT: 0, spawnTimer: 0, obstacles: [], sprays: [] };

  const sync = () => { scoreEl.textContent = Math.floor(game.distance); hpEl.textContent = game.hp; bestEl.textContent = best; };
  const reset = () => { Object.assign(game, { running: true, time: 0, distance: 0, hp: 3, speed: 0.014, shipX: 0, shipVx: 0, seaT: 0, spawnTimer: 0, obstacles: [], sprays: [] }); sync(); };

  const w2sx = (x, z) => { const h = H * 0.3, n = H * 0.9, k = (n - h) / Math.max(0.001, z); return W * 0.5 + (x - game.shipX) * k; };
  const w2sy = (z) => { const h = H * 0.3, n = H * 0.92; return h + (1 - 1 / Math.max(0.001, z)) * (n - h); };
  const sAt = (z) => (H * 0.55) / Math.max(0.001, z);

  function spawnObstacle() {
    const type = Math.random() < 0.55 ? 'mine' : 'rock', side = Math.random() < 0.5 ? -1 : 1;
    game.obstacles.push({ x: side * rand(2.2, 6.8), z: rand(22, 32), r: type === 'mine' ? rand(0.6, 0.95) : rand(0.9, 1.25), type, rot: rand(0, Math.PI * 2) });
  }

  function splash(x, z, good) {
    for (let i = 0; i < 16; i++) game.sprays.push({ x, z, vx: rand(-0.22, 0.22), vz: rand(-0.05, 0.08), life: rand(18, 34), max: 34, color: good ? '#8df6ff' : '#ff8ea1' });
  }

  function gameOver() {
    game.running = false;
    const d = Math.floor(game.distance);
    if (d > best) { best = d; localStorage.setItem(bestKey, String(best)); }
    sync();
    panel.style.display = 'grid';
    panelCard.innerHTML = `<h1>🌊 Рейс завершён</h1><p>Пройдено: <b>${d} м</b></p><p>Лучший рейс: <b>${best} м</b></p><p>Это вид от первого лица — как капитан на корабле.</p><button class="btn" id="restartBtn">Снова в море</button>`;
    document.getElementById('restartBtn').addEventListener('click', start);
  }

  function update() {
    if (!game.running) return;
    game.time++;
    game.distance += 0.35 + game.speed * 12;
    game.speed = 0.014 + Math.min(0.012, game.distance / 6000);
    game.seaT += game.speed * 1.8;

    const turn = (keys.right ? 1 : 0) + (keys.left ? -1 : 0);
    game.shipVx += turn * 0.017;
    game.shipVx *= 0.88;
    game.shipX += game.shipVx;
    game.shipX = Math.max(-8, Math.min(8, game.shipX));

    game.spawnTimer--;
    if (game.spawnTimer <= 0) { spawnObstacle(); game.spawnTimer = 36 - Math.min(26, Math.floor(game.distance / 120)); }

    for (let i = game.obstacles.length - 1; i >= 0; i--) {
      const o = game.obstacles[i];
      o.z -= (0.17 + game.speed * 9);
      o.rot += 0.04;
      if (o.z < 1.8 && Math.abs(o.x - game.shipX) < (o.r + 1.05)) {
        game.hp--; splash(o.x, 1.6, false); game.obstacles.splice(i, 1); sync(); if (game.hp <= 0) { gameOver(); return; } continue;
      }
      if (o.z <= 0.7) { splash(o.x, 1.2, true); game.obstacles.splice(i, 1); }
    }

    for (let i = game.sprays.length - 1; i >= 0; i--) { const p = game.sprays[i]; p.x += p.vx; p.z += p.vz; p.life--; if (p.life <= 0) game.sprays.splice(i, 1); }
    sync();
  }

  function drawBase() {
    const h = H * 0.3;
    const sky = ctx.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#8fd8ff'); sky.addColorStop(1, '#c8ecff'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, h);
    const sea = ctx.createLinearGradient(0, h, 0, H); sea.addColorStop(0, '#1f89b8'); sea.addColorStop(0.55, '#0e5e89'); sea.addColorStop(1, '#084264'); ctx.fillStyle = sea; ctx.fillRect(0, h, W, H - h);
    for (let i = 0; i < 20; i++) {
      const z = 1 + i * 1.5, y = w2sy(z), amp = 1.5 + (1 / z) * 9;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const wave = Math.sin((x * 0.012) + game.seaT * (1.6 + i * 0.03) + i) * amp;
        if (x === 0) ctx.moveTo(x, y + wave); else ctx.lineTo(x, y + wave);
      }
      ctx.strokeStyle = `rgba(220,245,255,${Math.max(0.05, 0.18 - i * 0.006)})`;
      ctx.lineWidth = Math.max(0.5, 2.2 / z);
      ctx.stroke();
    }
  }

  function drawObstacle(o) {
    const sx = w2sx(o.x, o.z), sy = w2sy(o.z), s = sAt(o.z) * o.r;
    if (sx < -80 || sx > W + 80 || sy < H * 0.28 || sy > H + 80) return;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(o.rot);
    if (o.type === 'mine') {
      ctx.fillStyle = '#2f3a47'; ctx.beginPath(); ctx.arc(0, 0, s * 0.62, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5f7083'; ctx.lineWidth = Math.max(1, s * 0.1);
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a) * s * 0.54, Math.sin(a) * s * 0.54); ctx.lineTo(Math.cos(a) * s * 0.9, Math.sin(a) * s * 0.9); ctx.stroke(); }
    } else {
      ctx.fillStyle = '#636d76'; ctx.beginPath(); ctx.moveTo(-s * 0.8, s * 0.4); ctx.lineTo(-s * 0.25, -s * 0.8); ctx.lineTo(s * 0.75, -s * 0.2); ctx.lineTo(s * 0.45, s * 0.65); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawSpray() {
    for (const p of game.sprays) {
      const a = Math.max(0, p.life / p.max), x = w2sx(p.x, Math.max(0.8, p.z)), y = w2sy(Math.max(0.8, p.z));
      ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.fillRect(x, y, 3, 3); ctx.globalAlpha = 1;
    }
  }

  function drawShip() {
    const cx = W * 0.5, by = H * 0.97, sway = Math.sin(game.time * 0.03) * 3 + game.shipVx * 14;
    ctx.save(); ctx.translate(cx + sway, 0);
    ctx.fillStyle = '#e7edf2'; ctx.beginPath(); ctx.moveTo(-140, by); ctx.lineTo(140, by); ctx.lineTo(52, H * 0.57); ctx.lineTo(-52, H * 0.57); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#4d6578'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-120, by); ctx.lineTo(-48, H * 0.58); ctx.moveTo(120, by); ctx.lineTo(48, H * 0.58); ctx.stroke();
    ctx.fillStyle = '#ff8c4f'; ctx.fillRect(-44, H * 0.72, 88, 62);
    ctx.fillStyle = '#20364f'; ctx.fillRect(-28, H * 0.73, 56, 26);
    ctx.fillStyle = 'rgba(220,245,255,0.8)'; ctx.beginPath(); ctx.arc(0, H * 0.58, 12, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    drawBase();
    for (const o of [...game.obstacles].sort((a, b) => b.z - a.z)) drawObstacle(o);
    drawSpray();
    drawShip();
  }

  function start() { panel.style.display = 'none'; reset(); }
  startBtn.addEventListener('click', start);
  (function loop() { update(); draw(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
