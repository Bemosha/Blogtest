<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Survival</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #fff;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .wrap { text-align: center; width: min(96vw, 720px); }
    h1 { margin: 0 0 8px; color: #a3e635; }
    p { opacity: .9; }
    canvas {
      background: #0b1020;
      border: 2px solid #a3e635;
      border-radius: 12px;
      max-width: 100%;
    }
    .muted { opacity: .7; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Создай игру танчики</h1>
    <p>Описание от пользователя: Создай игру танчики</p>
    <p>Управление: ← → или A/D. На телефоне — двигай пальцем по экрану.</p>
    <canvas id="game" width="420" height="620"></canvas>
    <p id="score">Счёт: 0</p>
    <p class="muted">Сгенерировано Telegram ботом 2026-04-01 10:42:39 UTC</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const player = { x: 190, y: 560, w: 40, h: 40, speed: 6 };
    const enemies = [];
    let score = 0;
    let running = true;
    const keys = new Set();

    function spawnEnemy() {
      enemies.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        w: 30,
        h: 30,
        speed: 2 + Math.random() * 3 + score * 0.01,
      });
    }

    function collide(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function update() {
      if (!running) return;

      if (keys.has('ArrowLeft') || keys.has('a')) player.x -= player.speed;
      if (keys.has('ArrowRight') || keys.has('d')) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      if (Math.random() < 0.04) spawnEnemy();

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;
        if (collide(player, e)) {
          running = false;
        }
        if (e.y > canvas.height + 40) {
          enemies.splice(i, 1);
          score += 1;
        }
      }

      scoreEl.textContent = running ? `Счёт: ${score}` : `Игра окончена. Счёт: ${score} (обнови страницу для рестарта)`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      ctx.fillStyle = '#fb7185';
      for (const e of enemies) ctx.fillRect(e.x, e.y, e.w, e.h);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => keys.add(e.key));
    window.addEventListener('keyup', (e) => keys.delete(e.key));

    let touchX = null;
    canvas.addEventListener('touchstart', (e) => {
      touchX = e.touches[0].clientX;
    });
    canvas.addEventListener('touchmove', (e) => {
      const x = e.touches[0].clientX;
      if (touchX !== null) player.x += (x - touchX) * 0.3;
      touchX = x;
    });
    canvas.addEventListener('touchend', () => touchX = null);

    loop();
  </script>
</body>
</html>
